name: CI Backup Script

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_SENDER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "GitHub Actions - Résultat des tests"
          to: "cedric.surquin@gmail.com"
          from: "GitHub Actions CI"
          body: |
            🚀 Résultat des tests pour le projet backup_script :
            
            - ✅ Tests réussis : ${{ job.status == 'success' }}
            - ❌ Tests échoués : ${{ job.status == 'failure' }}

            Détails ici : https://github.com/flavienLh/backup_script/actions
